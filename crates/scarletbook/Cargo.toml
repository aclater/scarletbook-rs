[package]
name = "scarletbook"
description = "Clean-room reader for Super Audio CD (Scarletbook) disc images"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["sacd", "dsd", "dst", "audio", "scarletbook"]
