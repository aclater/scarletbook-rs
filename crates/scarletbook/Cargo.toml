[package]
name = "scarletbook"
description = "Clean-room reader for Super Audio CD (Scarletbook) disc images"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["sacd", "dsd", "dst", "audio", "scarletbook"]
categories = ["multimedia::audio", "parser-implementations"]
include = ["src/**", "data/**", "Cargo.toml", "LICENSE-*", "README.md"]

[features]
# Decode DST frames on rayon's thread pool, ahead of the caller.
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1.10", optional = true }
thiserror = "2"

[dev-dependencies]
# Benchmarks (benches/); no plotting.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }
# Small thread pools in the tests of the `parallel` feature.
rayon = "1.10"

[[bench]]
name = "dst_frames"
harness = false

[lints]
workspace = true
