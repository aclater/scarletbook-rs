[package]
name = "scarletbook-ffi"
description = "C ABI for scarletbook, a clean-room Super Audio CD image reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
publish = false

[lib]
name = "scarletbook_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Track audio handles without a pool of their own (sb_track_audio_set_pool) decode on
# rayon's global pool instead of the calling thread.
parallel = []

[dependencies]
# Decoding pools (sb_pool_new) are in every build.
rayon = "1.10"
scarletbook = { path = "../scarletbook", features = ["parallel"] }

[lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dev-dependencies]
# Benchmarks (benches/); no plotting.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# The corpus directory and synthetic images of the benchmarks.
scarletbook-conformance = { path = "../scarletbook-conformance" }
serde_json = "1"
sha2 = "0.11"

[[bench]]
name = "toc_read"
harness = false

[[bench]]
name = "decode_pool"
harness = false
