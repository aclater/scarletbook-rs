[package]
name = "scarletbook-ffi"
description = "C ABI for scarletbook, a clean-room Super Audio CD image reader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["sacd", "dsd", "dst", "ffi", "audio"]
categories = ["multimedia::audio", "parser-implementations"]
# Only what builds the library and the header consumers link against; tests, benches,
# examples, ABI records and cbindgen's configuration stay in the repository.
include = ["/src/**", "/build.rs", "/build/**", "/include/**", "/Cargo.toml", "/LICENSE-MIT", "/LICENSE-APACHE"]

[lib]
name = "scarletbook_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Track audio handles without a pool of their own (sb_track_audio_set_pool) decode on
# rayon's global pool instead of the calling thread.
parallel = []
# `fuzz_disc_toc`, the harness of the `toc` fuzz target (fuzz/): never in the C library.
fuzzing = []

[dependencies]
# Decoding pools (sb_pool_new) are in every build.
rayon = "1.10"
# The exact versions of this release (crates.io needs a version beside the path); the
# release that bumps the workspace version bumps these too, or nothing builds.
scarletbook = { path = "../scarletbook", version = "=0.5.7", features = ["parallel", "output"] }
scarletbook-pcm = { path = "../scarletbook-pcm", version = "=0.5.7" }

[lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[dev-dependencies]
# Benchmarks (benches/); no plotting.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
# The corpus directory and synthetic images of the benchmarks.
scarletbook-conformance = { path = "../scarletbook-conformance" }
# Small synthetic images (the core crate's tests/common), for tests Miri can run.
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
sha2 = "0.11"

[[bench]]
name = "toc_read"
harness = false

[[bench]]
name = "decode_pool"
harness = false
