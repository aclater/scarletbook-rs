[workspace]
resolver = "3"
members = ["crates/scarletbook", "crates/scarletbook-bench", "crates/scarletbook-conformance", "crates/scarletbook-ffi"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aclater/scarletbook-rs"
readme = "README.md"

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Panics on hostile input are bugs; these catch the common sources.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# The conformance suite decodes full DST frames; unoptimised builds make it slow.
[profile.test]
opt-level = 2

[profile.dev.package.scarletbook]
opt-level = 2

# Arithmetic on image values is bounded by construction; keep the checks on so that a
# mistake shows up as a test or fuzz failure rather than as silent wrapping.
[profile.release]
overflow-checks = true

# The generic x86-64 release asset of `bench` (.github/workflows/release.yml). One codegen
# unit made generic builds 1-2% faster per 2-channel frame and 3-8% per 6-channel frame
# (issue #32, perf/build-configs.sh); for x86-64-v3 and znver5 it was up to 6% slower on
# 6 channels, so those assets keep the release profile. Fat LTO was 0-21% slower and PGO
# gained nothing consistent at any level, so neither is used. Re-measure with
# perf/build-configs.sh after changes to the decoder.
[profile.dist]
inherits = "release"
codegen-units = 1
