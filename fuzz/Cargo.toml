[package]
name = "scarletbook-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
scarletbook = { path = "../crates/scarletbook" }
# The `toc` target also reads the TOC through the C interface (`sb_disc_toc`).
scarletbook-ffi = { path = "../crates/scarletbook-ffi" }

[[bin]]
name = "toc"
path = "fuzz_targets/toc.rs"
test = false
doc = false
bench = false

# Not part of the main workspace: cargo-fuzz needs nightly and its own profile.
[workspace]

[[bin]]
name = "demux"
path = "fuzz_targets/demux.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dst"
path = "fuzz_targets/dst.rs"
test = false
doc = false
bench = false

[[bin]]
name = "seek_index"
path = "fuzz_targets/seek_index.rs"
test = false
doc = false
bench = false
