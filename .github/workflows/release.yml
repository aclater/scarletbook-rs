# SPDX-License-Identifier: MIT OR Apache-2.0
name: Release

# On a version tag (v0.1.0, ...): build the benchmark program `bench` for generic x86-64
# (sacd-spec benchmarks/README.md, "Release binaries"), run the correctness gate against
# that build, and publish it with a SHA-256 checksum. Two more labelled assets are built:
# for x86-64-v3 (AVX2, BMI2, FMA: most x86-64 CPUs since 2013-2015), and for AMD Zen 5
# (the measuring machine's CPU; it runs only on Zen 5). Asset names follow sacd-spec
# benchmarks/README.md, "Release binaries": the v3 build is not a benchmark asset, so its name
# matches neither `bench-<version>-x86_64-linux.tar.gz` nor `...-x86_64-linux-<cpu>.tar.gz`.
#
# The generic asset uses the `dist` profile (release with one codegen unit), the others
# the release profile; see Cargo.toml and issue #32 for the measurements.
#
# The release also carries the C library (scarletbook-ffi) for Linux (glibc and musl,
# x86_64 and aarch64), macOS (x86_64 and arm64) and Windows (x86_64, MinGW-w64), built and
# tested by clib.yml: scarletbook-ffi-<version>-<target>.tar.gz, each with a checksum.
# All assets share one build provenance attestation.
#
# The release notes start with the tag's section of CHANGELOG.md (`## [<version>] - <date>`);
# the release stops if there is none, so the Unreleased section must be renamed for the
# version in the commit that is tagged.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release per tag at a time; a second run for the same tag waits instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1

defaults:
  run:
    shell: bash

jobs:
  # Cheap checks first, so that a tag without a matching version or CHANGELOG.md section
  # stops the release before the seven C library builds.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches the crate version and has a CHANGELOG.md section
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          python3 -I .github/scripts/changelog-section.py CHANGELOG.md "$version" > /dev/null

  clib:
    needs: preflight
    uses: ./.github/workflows/clib.yml

  release:
    needs: clib
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub release and uploading its assets (`gh release create`).
      contents: write
      # Build provenance attestations (sigstore via the workflow's OIDC token).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - name: The tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "scarletbook-bench"))')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: The tag has a CHANGELOG.md section
        run: python3 -I .github/scripts/changelog-section.py CHANGELOG.md "$VERSION" > changelog-notes.md
      - name: Fetch the C library packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: clib-*
          path: dist
          merge-multiple: true
      - name: Build (generic x86-64)
        run: cargo build --profile dist --locked -p scarletbook-bench --target x86_64-unknown-linux-gnu
      # The gate's `bench` is the binary just built: same profile, flags and target dir.
      - name: Correctness gate on the generic build (every corpus case, 1 and all threads)
        run: cargo test --profile dist --locked -p scarletbook-bench --target x86_64-unknown-linux-gnu
      - name: Build (x86-64-v3)
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: target-v3
        run: cargo build --release --locked -p scarletbook-bench --target x86_64-unknown-linux-gnu
      - name: Correctness gate on the x86-64-v3 build
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: target-v3
        run: |
          # The v3 asset is published only if it passed the gate on this runner.
          if ! { grep -qw avx2 /proc/cpuinfo && grep -qw bmi2 /proc/cpuinfo && grep -qw fma /proc/cpuinfo && grep -qw movbe /proc/cpuinfo; }; then
            echo "::error::runner CPU is not x86-64-v3; the v3 build cannot be gated, so the release stops"
            exit 1
          fi
          cargo test --release --locked -p scarletbook-bench --target x86_64-unknown-linux-gnu
      - name: Build (AMD Zen 5)
        env:
          RUSTFLAGS: -C target-cpu=znver5
          CARGO_TARGET_DIR: target-znver5
        run: cargo build --release --locked -p scarletbook-bench --target x86_64-unknown-linux-gnu
      - name: Package
        run: |
          package() {
            local name=$1 bin=$2 note=$3
            mkdir -p "dist/$name"
            cp "$bin" "dist/$name/bench"
            cp LICENSE-MIT LICENSE-APACHE "dist/$name/"
            printf '%s\n' "scarletbook bench $VERSION ($GITHUB_SHA)" "$note" \
              "Interface: sacd-spec benchmarks/README.md." > "dist/$name/README.txt"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          }
          package "bench-$VERSION-x86_64-linux" \
            target/x86_64-unknown-linux-gnu/dist/bench \
            "Generic x86-64 build (no target-cpu; profile dist: release with one codegen unit)."
          package "bench-$VERSION-x86-64-v3-linux" \
            target-v3/x86_64-unknown-linux-gnu/release/bench \
            "Built with -C target-cpu=x86-64-v3 (AVX2, BMI1/2, FMA, MOVBE); runs on x86-64-v3 CPUs only."
          package "bench-$VERSION-x86_64-linux-znver5" \
            target-znver5/x86_64-unknown-linux-gnu/release/bench \
            "Built with -C target-cpu=znver5 for AMD Zen 5 (the measuring machine's CPU); runs only on Zen 5."
          (cd dist && sha256sum -c scarletbook-ffi-*.sha256)
          ls -l dist
      - name: Attest build provenance
        # Artifact attestations work on public repositories (private ones need GitHub
        # Enterprise Cloud); while the repository is private this step is skipped with a
        # warning instead of failing the release.
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: No attestation for a private repository
        if: github.event.repository.visibility != 'public'
        run: echo "::warning::repository is not public; release assets are published without a build provenance attestation"
      - name: Smoke-test the packaged binaries against the manifest
        run: |
          smoke() {
            tar -C /tmp -xzf "dist/$1.tar.gz"
            bin="/tmp/$1/bench"
            "$bin" --version
            for area in 2ch mc; do
              "$bin" decode corpus/images/dst-features-2ch-6ch.iso --area "$area" --threads 0 --sink hash > "got-$area.txt"
              python3 .github/scripts/compare-hashes.py dst-features-2ch-6ch "$area" "got-$area.txt"
            done
          }
          smoke "bench-$VERSION-x86_64-linux"
          # The gate above already stopped the release on a runner that is not x86-64-v3.
          smoke "bench-$VERSION-x86-64-v3-linux"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat changelog-notes.md
            echo
            echo "## Assets"
            echo
            echo "Built from $GITHUB_SHA.

          C library (scarletbook-ffi, C ABI version $(sed -n 's/^#define SB_ABI_VERSION //p' crates/scarletbook-ffi/include/scarletbook.h)): \`scarletbook-ffi-$VERSION-<target>.tar.gz\` holds the shared and static library and \`scarletbook.h\`, for x86_64-unknown-linux-gnu and aarch64-unknown-linux-gnu (glibc 2.17 or later), x86_64-unknown-linux-musl and aarch64-unknown-linux-musl (musl 1.2 or later), x86_64-apple-darwin (macOS 10.12 or later), aarch64-apple-darwin (macOS 11.0 or later) and x86_64-pc-windows-gnu (Windows 10 or later; UCRT, for MinGW-w64 GCC). Each has a \`.sha256\` checksum and, for a public repository, the build provenance attestation, and was tested on its platform. Linking, the ABI compatibility policy and verification: README, \"C library\".

          Benchmark program \`bench\` for sacd-spec benchmarks/README.md:
          - \`bench-$VERSION-x86_64-linux.tar.gz\`: generic x86-64 (the required asset).
          - \`bench-$VERSION-x86_64-linux-znver5.tar.gz\`: built for AMD Zen 5, the measuring machine's CPU (the optional labelled asset of benchmarks/README.md).
          - \`bench-$VERSION-x86-64-v3-linux.tar.gz\`: built for x86-64-v3 (AVX2 and later CPUs), labelled; an extra build for users, not one of the benchmark assets.
          Each has a \`.sha256\` checksum and, for a public repository, a signed build provenance attestation: \`gh attestation verify <asset> -R $GITHUB_REPOSITORY\`. The correctness gate (every corpus case, 1 and all threads) passed on the generic and x86-64-v3 builds."
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "scarletbook $VERSION" --verify-tag \
            --notes-file release-notes.md dist/*.tar.gz dist/*.sha256
