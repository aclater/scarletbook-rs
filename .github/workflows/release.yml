# SPDX-License-Identifier: MIT OR Apache-2.0
name: Release

# On a version tag (v0.1.0, ...): build the benchmark program `bench` for generic x86-64
# (sacd-spec benchmarks/README.md, "Release binaries"), run the correctness gate against
# that build, and publish it with a SHA-256 checksum. Two more labelled assets are built:
# for x86-64-v3 (AVX2, BMI2, FMA: most x86-64 CPUs since 2013-2015), and for AMD Zen 5
# (the measuring machine's CPU; it runs only on Zen 5). Asset names follow sacd-spec
# benchmarks/README.md, "Release binaries": the v3 build is not a benchmark asset, so its name
# matches neither `bench-<version>-x86_64-linux.tar.gz` nor `...-x86_64-linux-<cpu>.tar.gz`.
#
# The generic asset uses the `dist` profile (release with one codegen unit), the others
# the release profile; see Cargo.toml and issue #32 for the measurements.
#
# The release also carries the C library (scarletbook-ffi) for Linux (glibc and musl,
# x86_64 and aarch64), macOS (x86_64 and arm64) and Windows (x86_64, MinGW-w64), built and
# tested by clib.yml: scarletbook-ffi-<version>-<target>.tar.gz, each with a checksum, and
# for x86_64 Linux (glibc and musl) also an x86-64-v3 build,
# scarletbook-ffi-<version>-<target>-v3.tar.gz (issue #146).
#
# It also carries the benchmark kit that consumers run on their own machines
# (benchmarks/README.md, issue #226), built and checked by benchkit.yml: statically linked
# `bench`, `scarletbook-synth` and `callpattern` with the run list, for x86_64 Linux,
# generic and x86-64-v3: scarletbook-benchkit-<version>-x86_64-linux[-v3].tar.gz.
#
# Assets: (9 C library + 3 bench + 2 benchmark kit archives) x 2 (each with its .sha256)
# = 28. All archives share one build provenance attestation.
#
# After the GitHub release, the `publish` job publishes scarletbook-pcm, scarletbook and
# scarletbook-ffi to crates.io (issue #249) with trusted publishing (a 30-minute token from
# GitHub OIDC, no stored token), skipping any crate whose version is already there. Each
# crate has its own version: from 1.0.0, scarletbook-pcm stays at 0.7.0 (#398), so its
# version is on crates.io and it is skipped; the tag matches the workspace version. It runs
# only on tag pushes (the only trigger of this workflow) and only after every other job
# here succeeded. RELEASING.md has the first publish of a crate, which trusted publishing
# cannot do.
#
# `preflight` stops a tag whose commit is not on the default branch or has not passed the
# branch's required checks (issue #341). The two jobs that sign or publish, `release` and
# `publish`, run in the environment `release`, which only `v*` tags may use (RELEASING.md).
#
# Those two compile nothing (issue #345). The `build` job, with a read-only token, builds and
# gates `bench`, packages and checks all 28 assets, writes the release notes, and packs and
# verifies the crates.io packages of the crates not on crates.io yet; it hands the files over as the artifact `release-files`.
# `release` attests and uploads them; `publish` publishes each crate with --no-verify once
# its repacked .crate is byte-identical to the verified one.
#
# The split keeps the tokens and the signing out of every step that runs dependency code; it
# does not make `build`'s output trustworthy. A compromised dependency in `build` (or in clib
# or benchkit) could alter the archives or the packed crates, and `release` would then attest
# and upload them, and `publish` publish them, as they are.
#
# The release notes start with the tag's section of CHANGELOG.md (`## [<version>] - <date>`);
# the release stops if there is none, so the Unreleased section must be renamed for the
# version in the commit that is tagged.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release per tag at a time; a second run for the same tag waits instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1

defaults:
  run:
    shell: bash

jobs:
  # Cheap checks first, so that a tag on the wrong commit, or without a matching version or
  # CHANGELOG.md section, stops the release before the nine C library builds.
  preflight:
    runs-on: ubuntu-latest
    # The source check waits up to 45 minutes for main's checks on a just-merged commit.
    timeout-minutes: 60
    permissions:
      contents: read # checkout, and the compare API for the source check
      checks: read # the tagged commit's check runs, for the source check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Issue #341: the tagged commit must be on the default branch and have passed its
      # required checks. This stops a stray or mistaken tag, not a tag on a commit that edits
      # this workflow (that commit's copy runs); the `release` environment and the tag
      # ruleset's creation rule (RELEASING.md, "Repository and crates.io settings") cover that.
      - name: The tagged commit is on the default branch and passed its required checks
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -I .github/scripts/release-source-check.py "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$DEFAULT_BRANCH"
      - name: The tag matches the crate version and has a CHANGELOG.md section
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          python3 -I .github/scripts/changelog-section.py CHANGELOG.md "$version" > /dev/null

  clib:
    needs: preflight
    uses: ./.github/workflows/clib.yml

  benchkit:
    needs: preflight
    uses: ./.github/workflows/benchkit.yml

  # Issue #345: everything that compiles code (and so runs dependencies' build scripts and
  # proc macros) runs here, with a read-only token and no environment: `bench` and its
  # correctness gates, the packaging and checks of all 28 assets, the release notes, and the
  # crates.io packages, packed and verified (`cargo package`, which builds them). The jobs
  # that sign, upload and publish (`release`, `publish`) only take over these files.
  build:
    needs: [clib, benchkit]
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only; nothing here writes, signs or publishes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - name: The tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "scarletbook-bench"))')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: The tag has a CHANGELOG.md section
        run: python3 -I .github/scripts/changelog-section.py CHANGELOG.md "$VERSION" > changelog-notes.md
      - name: Fetch the C library packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: clib-*
          path: dist
          merge-multiple: true
      - name: Fetch the benchmark kits
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: benchkit-*
          path: dist
          merge-multiple: true
      - name: Build (generic x86-64)
        run: cargo build --profile dist --locked -p scarletbook-bench --target x86_64-unknown-linux-gnu
      # The gate's `bench` is the binary just built: same profile, flags and target dir.
      - name: Correctness gate on the generic build (every corpus case, 1 and all threads)
        run: cargo test --profile dist --locked -p scarletbook-bench --target x86_64-unknown-linux-gnu
      - name: Build (x86-64-v3)
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: target-v3
        run: cargo build --release --locked -p scarletbook-bench --target x86_64-unknown-linux-gnu
      - name: Correctness gate on the x86-64-v3 build
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
          CARGO_TARGET_DIR: target-v3
        run: |
          # The v3 asset is published only if it passed the gate on this runner.
          if ! { grep -qw avx2 /proc/cpuinfo && grep -qw bmi2 /proc/cpuinfo && grep -qw fma /proc/cpuinfo && grep -qw movbe /proc/cpuinfo; }; then
            echo "::error::runner CPU is not x86-64-v3; the v3 build cannot be gated, so the release stops"
            exit 1
          fi
          cargo test --release --locked -p scarletbook-bench --target x86_64-unknown-linux-gnu
      - name: Build (AMD Zen 5)
        env:
          RUSTFLAGS: -C target-cpu=znver5
          CARGO_TARGET_DIR: target-znver5
        run: cargo build --release --locked -p scarletbook-bench --target x86_64-unknown-linux-gnu
      - name: Package
        run: |
          package() {
            local name=$1 bin=$2 note=$3
            mkdir -p "dist/$name"
            cp "$bin" "dist/$name/bench"
            cp LICENSE-MIT LICENSE-APACHE "dist/$name/"
            printf '%s\n' "scarletbook bench $VERSION ($GITHUB_SHA)" "$note" \
              "Interface: sacd-spec benchmarks/README.md." > "dist/$name/README.txt"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          }
          package "bench-$VERSION-x86_64-linux" \
            target/x86_64-unknown-linux-gnu/dist/bench \
            "Generic x86-64 build (no target-cpu; profile dist: release with one codegen unit)."
          package "bench-$VERSION-x86-64-v3-linux" \
            target-v3/x86_64-unknown-linux-gnu/release/bench \
            "Built with -C target-cpu=x86-64-v3 (AVX2, BMI1/2, FMA, MOVBE); runs on x86-64-v3 CPUs only."
          package "bench-$VERSION-x86_64-linux-znver5" \
            target-znver5/x86_64-unknown-linux-gnu/release/bench \
            "Built with -C target-cpu=znver5 for AMD Zen 5 (the measuring machine's CPU); runs only on Zen 5."
          (cd dist && sha256sum -c scarletbook-ffi-*.sha256 scarletbook-benchkit-*.sha256)
          ls -l dist
          # 9 C library, 3 bench and 2 benchmark kit archives, each with its checksum:
          # clib.yml's and benchkit.yml's matrix entries, the v3 ones included, all reached
          # the release (28 assets).
          archives=$(ls dist/*.tar.gz | wc -l) checksums=$(ls dist/*.tar.gz.sha256 | wc -l)
          if [[ "$archives" != 14 || "$checksums" != 14 ]]; then
            echo "::error::$archives archives and $checksums checksums, expected 14 and 14"
            exit 1
          fi
      - name: Smoke-test the packaged binaries against the manifest
        run: |
          smoke() {
            tar -C /tmp -xzf "dist/$1.tar.gz"
            bin="/tmp/$1/bench"
            "$bin" --version
            for area in 2ch mc; do
              "$bin" decode corpus/images/dst-features-2ch-6ch.iso --area "$area" --threads 0 --sink hash > "got-$area.txt"
              python3 .github/scripts/compare-hashes.py dst-features-2ch-6ch "$area" "got-$area.txt"
            done
          }
          smoke "bench-$VERSION-x86_64-linux"
          # The gate above already stopped the release on a runner that is not x86-64-v3.
          smoke "bench-$VERSION-x86-64-v3-linux"
      - name: Release notes
        run: |
          {
            cat changelog-notes.md
            echo
            echo "## Assets"
            echo
            echo "Built from $GITHUB_SHA.

          C library (scarletbook-ffi, C ABI version $(sed -n 's/^#define SB_ABI_VERSION //p' crates/scarletbook-ffi/include/scarletbook.h)): \`scarletbook-ffi-$VERSION-<target>.tar.gz\` holds the shared and static library and \`scarletbook.h\`, for x86_64-unknown-linux-gnu and aarch64-unknown-linux-gnu (glibc 2.17 or later), x86_64-unknown-linux-musl and aarch64-unknown-linux-musl (musl 1.2 or later), x86_64-apple-darwin (macOS 10.12 or later), aarch64-apple-darwin (macOS 11.0 or later) and x86_64-pc-windows-gnu (Windows 10 or later; UCRT, for MinGW-w64 GCC). \`scarletbook-ffi-$VERSION-x86_64-unknown-linux-gnu-v3.tar.gz\` and \`scarletbook-ffi-$VERSION-x86_64-unknown-linux-musl-v3.tar.gz\` are the same two targets built for x86-64-v3 (AVX2, BMI2, FMA and the rest of the level): the same ABI, but they fail on CPUs without those features; check the CPU before loading them (docs/releases.md, \"Release assets\"). Each has a \`.sha256\` checksum and, for a public repository, the build provenance attestation, and was tested on its platform. Linking and the ABI compatibility policy: docs/c-abi.md; verification: docs/releases.md.

          Benchmark program \`bench\` for sacd-spec benchmarks/README.md:
          - \`bench-$VERSION-x86_64-linux.tar.gz\`: generic x86-64 (the required asset).
          - \`bench-$VERSION-x86_64-linux-znver5.tar.gz\`: built for AMD Zen 5, the measuring machine's CPU (the optional labelled asset of benchmarks/README.md).
          - \`bench-$VERSION-x86-64-v3-linux.tar.gz\`: built for x86-64-v3 (AVX2 and later CPUs), labelled; an extra build for users, not one of the benchmark assets.
          Each has a \`.sha256\` checksum (it detects a damaged download, not a replaced one) and, for a public repository, a signed build provenance attestation: \`gh attestation verify <asset> -R $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref $GITHUB_REF\`. The correctness gate (every corpus case, 1 and all threads) passed on the generic and x86-64-v3 builds.

          Benchmark kit for running the benchmarks on your own machines (benchmarks/README.md): \`scarletbook-benchkit-$VERSION-x86_64-linux.tar.gz\` (generic x86-64) and \`scarletbook-benchkit-$VERSION-x86_64-linux-v3.tar.gz\` (x86-64-v3 CPUs only) hold statically linked \`bench\`, \`scarletbook-synth\` and \`callpattern\`, the run list \`runlist.json\` and its reference runner \`run.py\`. Match the names exactly: a prefix of the generic name also matches the v3 one."
          } > release-notes.md
      # The crates.io packages, verified here: `cargo package` builds each packed crate.
      # `publish` repacks them with --no-verify, compiling nothing, and publishes only if
      # the repacked file is byte-identical to the one verified here (cargo packs
      # reproducibly: the same sources and cargo give the same .crate).
      # Each crate at its own version (release-crates.py): from 1.0.0, scarletbook-pcm keeps
      # 0.7.0 while the other two follow the tag (#398). Only the crates whose version is
      # not on crates.io yet are packed, together; the others resolve from crates.io, as they
      # will for `publish` and for users. A skipped crate must not be packed here: its repack
      # never matches its published file (.cargo_vcs_info.json names the commit), and a
      # crate packed beside it would pin the repack's checksum, which crates.io does not
      # have. That stopped 1.0.0 halfway (RELEASING.md, "Pack only what is published").
      # The index lookup is read-only and needs no token.
      - name: Crates whose version is not on crates.io yet
        id: pending
        run: python3 -I .github/scripts/release-crates.py pending
      - name: Pack and verify the crates.io packages
        env:
          CRATES: ${{ steps.pending.outputs.pending }}
        run: |
          mkdir crates-io
          if [[ -z "$CRATES" ]]; then
            echo "::warning::every crate's version is already on crates.io; nothing to publish"
            : > crates-io/SHA256SUMS
            exit 0
          fi
          args=()
          for crate in $CRATES; do args+=(-p "$crate"); done
          cargo package --locked "${args[@]}"
          versions=$(python3 -I .github/scripts/release-crates.py versions)
          for crate in $CRATES; do
            cp "target/package/$crate-$(awk -v c="$crate" '$1 == c { print $2 }' <<< "$versions").crate" crates-io/
          done
          # Every pin of a published crate in their Cargo.lock is what crates.io will hold.
          python3 -I .github/scripts/release-crates.py lockcheck crates-io
          (cd crates-io && sha256sum *.crate | tee SHA256SUMS)
          if [[ $(ls crates-io/*.crate | wc -l) != $(wc -w <<< "$CRATES") ]]; then
            echo "::error::expected one crates.io package for each of: $CRATES"
            exit 1
          fi
      - name: Hand over the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            release-notes.md
            crates-io/
          if-no-files-found: error
          retention-days: 7

  # Attests and uploads what `build` made; compiles nothing.
  release:
    needs: build
    runs-on: ubuntu-latest
    # Signs (attestation) and uploads, in the environment `release`, which only `v*` tags may
    # use (issue #341; RELEASING.md, "Repository and crates.io settings").
    environment: release
    permissions:
      # Creating the GitHub release and uploading its assets (`gh release create`).
      contents: write
      # Build provenance attestations (sigstore via the workflow's OIDC token).
      id-token: write
      attestations: write
    steps:
      - name: Fetch the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - name: The 28 assets arrived intact
        run: |
          (cd dist && sha256sum -c *.sha256)
          ls -l dist
          archives=$(ls dist/*.tar.gz | wc -l) checksums=$(ls dist/*.tar.gz.sha256 | wc -l)
          if [[ "$archives" != 14 || "$checksums" != 14 ]]; then
            echo "::error::$archives archives and $checksums checksums, expected 14 and 14"
            exit 1
          fi
      - name: Attest build provenance
        # Artifact attestations work on public repositories (private ones need GitHub
        # Enterprise Cloud); while the repository is private this step is skipped with a
        # warning instead of failing the release.
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: No attestation for a private repository
        if: github.event.repository.visibility != 'public'
        run: echo "::warning::repository is not public; release assets are published without a build provenance attestation"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "scarletbook ${GITHUB_REF_NAME#v}" \
            --verify-tag --notes-file release-notes.md dist/*.tar.gz dist/*.sha256

  # crates.io, after everything above passed (issue #249). Dependency order: scarletbook-ffi
  # depends on the other two at their exact versions. Idempotent: a version already on
  # crates.io (a re-run, or a first publish done by hand per RELEASING.md) is skipped.
  # This job must stay in release.yml itself, not in a reusable workflow: the trusted
  # publisher of each crate on crates.io names exactly this repository and workflow file
  # (RELEASING.md, "Repository and crates.io settings").
  # It compiles nothing (issue #345): `cargo publish` cannot upload a given .crate file, so
  # each crate is repacked from the tagged sources with --no-verify, checked to be
  # byte-identical to the package `build` verified, and published with --no-verify.
  publish:
    name: Publish to crates.io
    needs: [build, release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read # checking out the tagged sources
      id-token: write # the OIDC token crates-io-auth-action exchanges for a crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - name: Fetch the verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files
      # Each crate's own version (its manifest, not the tag) looked up in the crates.io
      # sparse index; a version already there is skipped: a crate this release leaves
      # unchanged (scarletbook-pcm stays 0.7.0 from 1.0.0, #398), a re-run, or a first
      # publish done by hand. Tested by release-crates-test.py.
      - name: Crates whose version is not on crates.io yet
        id: pending
        run: python3 -I .github/scripts/release-crates.py pending
      # The crates still to publish, packed together as `build` packed them, before anything
      # is uploaded: a mismatch stops the job here rather than after the first crate is
      # published. On a re-run after a partial publish this is a subset of `build`'s set; the
      # crates already published resolve from crates.io, which holds the very files `build`
      # packed (each was published only after matching its file), so the rest repack the
      # same. release-publish.sh checks each crate again right before its upload.
      - name: The repacked crates match the verified packages
        if: steps.pending.outputs.pending != ''
        env:
          CRATES: ${{ steps.pending.outputs.pending }}
        run: bash .github/scripts/release-publish.sh precheck
      - name: Authenticate with crates.io (trusted publishing)
        if: steps.pending.outputs.existing != ''
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the new versions of existing crates
        if: steps.pending.outputs.existing != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.pending.outputs.existing }}
        run: bash .github/scripts/release-publish.sh
      # A crate's first version (RELEASING.md, "The first publish of a crate"): only with the
      # secret CRATES_IO_BOOTSTRAP_TOKEN of the environment `release`, a short-lived token the
      # owner sets for that one release and deletes and revokes afterwards. Without it the job
      # fails here, after everything else was published, and the crate is published by hand.
      - name: Publish crates that are not on crates.io yet (bootstrap)
        if: steps.pending.outputs.new != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
          CRATES: ${{ steps.pending.outputs.new }}
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "::error::not on crates.io yet: $CRATES. Trusted publishing cannot create a crate; publish its first version by hand from this tag (RELEASING.md, option A), then re-run this job"
            exit 1
          fi
          echo "::warning::publishing $CRATES with CRATES_IO_BOOTSTRAP_TOKEN; delete the secret and revoke the token now (RELEASING.md)"
          bash .github/scripts/release-publish.sh
