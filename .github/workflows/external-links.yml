# SPDX-License-Identifier: MIT OR Apache-2.0
name: External links

# The external URLs (http and https) in the tracked Markdown files, weekly and on demand
# (#412). Deliberately not a pull request check: a site that is down for a day must not
# block a merge. The links inside the repository are ci.yml's `link-check`, on every pull
# request. A run that finds broken links opens one issue, or comments on it while it is open.

on:
  schedule:
    - cron: "29 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      exit-code: ${{ steps.lychee.outputs.exit_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only http and https are fetched; links inside the repository are linkcheck.py's.
      # Left out, each on purpose:
      # - corpus/README.md: sacd-spec's copy, left out as in linkcheck.py;
      # - the walled repositories (CLEANROOM.md): never fetched, should a link to one appear;
      # - ACM (10.1145), Oxford Academic (10.1093), Wiley (10.1002) and SIAM (10.1137) DOIs:
      #   their publishers answer automated clients with 403 Forbidden whatever the link
      #   (docs/provenance/EVIDENCE.md cites many; Wiley and SIAM added after #454);
      # - two URLs quoted as records, not as links to follow: Wang's 1997 page, now gone and
      #   linked through its Wayback Machine capture (EVIDENCE.md), and the Wayback CDX
      #   endpoint a CLEANROOM.md log row names (400 without a query).
      # Accepted as well as 2xx: 429 Too Many Requests and 503 Service Unavailable, which say
      # "try later", not "gone" (#454: a GitHub blob page and a blog both fetched fine on a
      # re-check). A site down for good still shows up as 404 or 410.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        id: lychee
        with:
          lycheeVersion: v0.24.2
          fail: false
          output: lychee/out.md
          args: >-
            --no-progress
            --scheme https --scheme http
            --exclude-all-private
            --exclude-path 'corpus/README\.md$'
            --exclude '^https?://github\.com/aclater/(sacd|dsd-toolbox|sacdfs|pysacd|beets-pysacd)([/?#]|$)'
            --exclude '(pysacd|sacdfs|dsd-toolbox)'
            --exclude '^https://doi\.org/10\.(1145|1093|1002|1137)/'
            --exclude '^http://www\.concentric\.net/~Ttwang/tech/inthash\.htm$'
            --exclude '^https://web\.archive\.org/cdx/search/cdx$'
            --accept '200..=299,429,503'
            --max-retries 3
            --retry-wait-time 10
            --timeout 30
            './**/*.md'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.lychee.outputs.exit_code != '0'
        with:
          name: external-links-report
          path: lychee/out.md
          retention-days: 30
      - name: Fail on broken links
        if: steps.lychee.outputs.exit_code != '0'
        env:
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        run: |
          echo "::error::lychee exited with $EXIT_CODE; the report is in the job summary and the run's artifact"
          exit 1

  # The only job with write access, and only to issues.
  report:
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.exit-code != '' && needs.check.outputs.exit-code != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: external-links-report
          path: report
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "External link check: broken links"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The weekly external link check ($RUN_URL) found broken links."
            echo "Links inside the repository are checked on every pull request; these are external URLs (external-links.yml, #412)."
            echo
            head -c 60000 report/out.md
          } > body.md
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
