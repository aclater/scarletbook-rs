# SPDX-License-Identifier: MIT OR Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manual run on any branch takes the full path, Miri included (e.g. before a PR that
  # touches the core crate's internals).
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch, main included, cancels the older run: on main every
# commit has already passed the pull request's checks, and the newest run checks everything
# that came before it, so merges in a row do not queue behind each other's Miri (#76).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1
  RUST_NIGHTLY: nightly-2026-10-30
  RUST_MSRV: 1.85.0

defaults:
  run:
    shell: bash

jobs:
  # Whether the change can affect what Miri and fuzzing check: the Rust code, its
  # dependencies, the corpus or this workflow. Pushes to main always count as changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      miri: ${{ steps.diff.outputs.miri }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo 'miri=["ffi","ffi-slow","parallel"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          printf '%s\n' "$changed"
          if grep -qE '^(crates/|fuzz/|corpus/|Cargo\.(toml|lock)$|rust-toolchain|\.github/workflows/(ci|miri)\.yml$)' <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # Miri checks unsafe code: scarletbook-ffi's own, and the dependencies'. `scarletbook`
          # and `scarletbook-pcm` deny unsafe code outside one run-time dispatch module each
          # (#146, #173), so their full tests run under Miri only in miri-full.yml (main and
          # nightly). `ffi` and `ffi-slow` (scarletbook-ffi's tests, split in two, #205) run
          # when any crate it calls changes; `parallel` (rayon under Tree Borrows) when the core
          # crate does; `core-dispatch` (the core dispatch module's bit-identity tests) when that
          # module, the decoder or the output path it builds does; all of them when the
          # dependencies, the toolchain or these workflows do.
          shared='^(Cargo\.lock$|rust-toolchain|\.github/workflows/(ci|miri)\.yml$)'
          slices=()
          if grep -qE "^crates/|$shared" <<< "$changed"; then slices+=('"ffi"' '"ffi-slow"'); fi
          if grep -qE "^crates/scarletbook/|$shared" <<< "$changed"; then slices+=('"parallel"'); fi
          if grep -qE "^crates/scarletbook/src/(dispatch|dst|output/(mod|dsf|dsdiff|dsdiff_dst))\.rs$|$shared" <<< "$changed"; then slices+=('"core-dispatch"'); fi
          echo "miri=[$(IFS=,; echo "${slices[*]}")]" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Line tables are enough for backtraces in a failing test; full debug info made the
      # Windows link (PDBs) a large part of its 3-minute build.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache; pull requests read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.148
      # Both feature sets on Linux. macOS and Windows run one pass with every feature, and
      # leave out the bench crate (a Linux benchmark tool, built and tested on Linux): the
      # platform-specific code is the same in both feature sets. cargo-nextest runs the test
      # binaries in parallel, where `cargo test` ran them one after another (#205); it does
      # not run doctests, so `cargo test --doc` runs those.
      - if: matrix.os == 'ubuntu-latest'
        run: |
          cargo nextest run --workspace --locked
          cargo test --workspace --locked --doc
      - if: matrix.os == 'ubuntu-latest'
        run: |
          cargo nextest run --workspace --locked --all-features
          cargo test --workspace --locked --all-features --doc
      - if: matrix.os != 'ubuntu-latest'
        run: |
          cargo nextest run --workspace --locked --all-features --exclude scarletbook-bench
          cargo test --workspace --locked --all-features --exclude scarletbook-bench --doc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The change-record check diffs against the base branch and needs the merge base.
          fetch-depth: 0
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal -c rustfmt,clippy && rustup default "$RUST_STABLE"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache; pull requests read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # The licences must ship inside the published crate (issue #48); its copies must match
      # the repository's.
      - name: The published packages carry the licences and README
        run: |
          for pkg in scarletbook scarletbook-pcm; do
            cmp LICENSE-MIT "crates/$pkg/LICENSE-MIT"
            cmp LICENSE-APACHE "crates/$pkg/LICENSE-APACHE"
            files=$(cargo package -p "$pkg" --list --locked)
            for f in LICENSE-MIT LICENSE-APACHE README.md; do
              grep -qx "$f" <<< "$files" || { echo "::error::$f is missing from the $pkg package"; exit 1; }
            done
          done
      # Change records live in changelog.d/ and cleanroom.d/ until a release folds them in
      # (#76; CONTRIBUTING.md, "Change records"): their format, and on pull requests that a
      # change to library or program code adds one of each.
      - name: Change-record fragments
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 -I .github/scripts/fragments-test.py
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            python3 -I .github/scripts/fragments.py require "origin/$BASE_REF"
          else
            python3 -I .github/scripts/fragments.py check
          fi
      # miri.yml pins its own nightly (a called workflow does not inherit this file's env);
      # keep the two the same.
      - name: miri.yml uses the same nightly as this workflow
        run: |
          pinned=$(sed -n 's/^  RUST_NIGHTLY: //p' .github/workflows/miri.yml)
          if [[ "$pinned" != "$RUST_NIGHTLY" ]]; then
            echo "::error::miri.yml pins $pinned, ci.yml $RUST_NIGHTLY"
            exit 1
          fi
      # release.yml takes the release notes from CHANGELOG.md with this script.
      - name: CHANGELOG.md sections for the release notes
        run: |
          python3 -I .github/scripts/changelog-section.py CHANGELOG.md 0.2.0 > /dev/null
          ! python3 -I .github/scripts/changelog-section.py CHANGELOG.md 0.0.0 2> /dev/null

  # The criterion benchmarks are compiled so that they do not rot; timing them on shared
  # runners would mean nothing (README, "Measuring performance").
  bench-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache; pull requests read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo bench --workspace --locked --no-run
      - run: bash -n perf/*.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_MSRV" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache; pull requests read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +"$RUST_MSRV" check -p scarletbook -p scarletbook-pcm -p scarletbook-ffi --all-features --locked

  # Miri: the slices for unsafe code here, chosen by the changes job (#76); the core crate's
  # tests and the long slices run in miri-full.yml, which queues instead of cancelling so that
  # they always complete (#84).
  miri:
    needs: changes
    if: needs.changes.outputs.miri != '[]'
    uses: ./.github/workflows/miri.yml
    with:
      slices: ${{ needs.changes.outputs.miri }}

  ffi:
    name: ffi (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache; pull requests read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The committed header is what cbindgen generates
        if: runner.os == 'Linux'
        working-directory: crates/scarletbook-ffi
        run: |
          cargo install cbindgen --locked --version 0.29.4
          cbindgen --config cbindgen.toml --crate scarletbook-ffi --output include/scarletbook.h --verify
      # An addition to the ABI regenerates the baseline abi/abi-N.txt; a breaking change
      # bumps SB_ABI_VERSION and adds abi-(N+1).txt (README, "ABI compatibility"). On a
      # pull request the header is also classified against the base branch's baseline, so a
      # hand-rewritten baseline cannot hide a breaking change, and the baselines of earlier
      # versions must be unchanged.
      - name: The ABI matches its baseline
        if: runner.os == 'Linux'
        run: |
          python3 .github/scripts/abi-check-test.py
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            python3 .github/scripts/abi-check.py
            exit 0
          fi
          current=$(sed -n 's/^#define SB_ABI_VERSION //p' crates/scarletbook-ffi/include/scarletbook.h)
          git fetch --quiet --depth=1 origin "$GITHUB_BASE_REF"
          if git show "FETCH_HEAD:crates/scarletbook-ffi/abi/abi-$current.txt" > "$RUNNER_TEMP/base-abi.txt" 2> /dev/null; then
            python3 .github/scripts/abi-check.py --base "$RUNNER_TEMP/base-abi.txt"
          else
            python3 .github/scripts/abi-check.py
          fi
          edited=$(git diff --no-renames --name-only --diff-filter=MD FETCH_HEAD HEAD -- crates/scarletbook-ffi/abi \
            | grep -v "/abi-$current\.txt$" || true)
          if [[ -n "$edited" ]]; then
            echo "::error::baselines of earlier ABI versions edited or removed: $edited"
            exit 1
          fi
      - run: cargo build -p scarletbook-ffi --release --locked
      # The core crate's run-time dispatch still builds its hot loops with the dispatched
      # features (#202): checked on the library just built, in about 2 seconds.
      - name: The dispatched functions keep their hot loops
        if: runner.os == 'Linux'
        run: BINARY=target/release/libscarletbook_ffi.so perf/dispatch-inlining.sh
      - name: Build and run the C smoke test
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Icrates/scarletbook-ffi/include \
            crates/scarletbook-ffi/examples/smoke.c target/release/libscarletbook_ffi.a -lpthread -ldl -lm -o smoke
          for id in hostile-base dst-features-2ch-6ch dst-invalid-frames-6ch layout-2054 master-version-99 truncated-in-audio; do
            ./smoke "corpus/images/$id.iso"
          done

  # LeakSanitizer (#238): every handle and buffer the C interface hands out is freed by its
  # documented call, on success and on every error path. scarletbook-ffi's tests (the fuzz
  # harnesses of the `fuzzing` feature included) run with LSan's runtime linked in, and the
  # C smoke test runs linked with -fsanitize=leak; a leak fails the step. LSan needs no
  # instrumentation, only its allocator, so the C test links the ordinary release library.
  # Miri's `ffi` slices also report leaks, on reduced cases; the fuzz jobs run under
  # AddressSanitizer, whose leak check is on by default.
  lsan:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup toolchain install "$RUST_NIGHTLY" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache; pull requests read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The C interface tests under LeakSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=leak
          LSAN_OPTIONS: exitcode=23
        run: |
          cargo +"$RUST_NIGHTLY" test -p scarletbook-ffi --all-features --locked \
            --target x86_64-unknown-linux-gnu --tests
      - name: The C smoke test under LeakSanitizer
        env:
          LSAN_OPTIONS: exitcode=23
        run: |
          cargo +"$RUST_STABLE" build -p scarletbook-ffi --release --locked
          cc -std=c99 -Wall -Wextra -Werror -pedantic -fsanitize=leak -Icrates/scarletbook-ffi/include \
            crates/scarletbook-ffi/examples/smoke.c target/release/libscarletbook_ffi.a -lpthread -ldl -lm -o smoke-lsan
          for id in hostile-base dst-features-2ch-6ch dst-invalid-frames-6ch layout-2054 master-version-99 truncated-in-audio; do
            ./smoke-lsan "corpus/images/$id.iso"
          done

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # One job per fuzz target, in parallel (#76): 30 s each on pull requests, 60 s on main.
  # fuzz-long.yml does the long runs. The last step checks that this list is every target.
  fuzz:
    name: fuzz (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [toc, demux, dst, seek_index]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup toolchain install "$RUST_NIGHTLY" --profile minimal
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz
      - name: Seed from the conformance corpus
        run: cargo +"$RUST_STABLE" run --locked -p scarletbook-conformance --bin scarletbook-seeds -- fuzz/corpus
      - name: The matrix lists every fuzz target
        working-directory: fuzz
        run: |
          listed=$(cargo +"$RUST_NIGHTLY" fuzz list | sort | tr '\n' ' ')
          if [[ "$listed" != "demux dst seek_index toc " ]]; then
            echo "::error::fuzz targets are now: $listed; update the fuzz job's matrix"
            exit 1
          fi
      - name: Short fuzz run
        working-directory: fuzz
        env:
          TARGET: ${{ matrix.target }}
        run: |
          seconds=60
          [[ "$GITHUB_EVENT_NAME" == pull_request ]] && seconds=30
          # The prebuilt cargo-fuzz is a musl binary and would default to a musl target.
          cargo +"$RUST_NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu "$TARGET" "corpus/$TARGET" -- \
            -max_total_time="$seconds" -max_len=327680 -timeout=10
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
