# SPDX-License-Identifier: MIT OR Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manual run on any branch takes the full path, Miri included (e.g. before a PR that
  # touches the core crate's internals).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1
  RUST_NIGHTLY: nightly-2026-10-30
  RUST_MSRV: 1.85.0

defaults:
  run:
    shell: bash

jobs:
  # Whether the change can affect what Miri and fuzzing check: the Rust code, its
  # dependencies, the corpus or this workflow. Pushes to main always count as changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          printf '%s\n' "$changed"
          if grep -qE '^(crates/|fuzz/|corpus/|Cargo\.(toml|lock)$|rust-toolchain|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache; pull requests read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --all-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal -c rustfmt,clippy && rustup default "$RUST_STABLE"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache; pull requests read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # The licences must ship inside the published crate (issue #48); its copies must match
      # the repository's.
      - name: The scarletbook package carries the licences and README
        run: |
          cmp LICENSE-MIT crates/scarletbook/LICENSE-MIT
          cmp LICENSE-APACHE crates/scarletbook/LICENSE-APACHE
          files=$(cargo package -p scarletbook --list --locked)
          for f in LICENSE-MIT LICENSE-APACHE README.md; do
            grep -qx "$f" <<< "$files" || { echo "::error::$f is missing from the scarletbook package"; exit 1; }
          done
      # release.yml takes the release notes from CHANGELOG.md with this script.
      - name: CHANGELOG.md sections for the release notes
        run: |
          python3 -I .github/scripts/changelog-section.py CHANGELOG.md 0.2.0 > /dev/null
          ! python3 -I .github/scripts/changelog-section.py CHANGELOG.md 0.0.0 2> /dev/null

  # The criterion benchmarks are compiled so that they do not rot; timing them on shared
  # runners would mean nothing (README, "Measuring performance").
  bench-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache; pull requests read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo bench --workspace --locked --no-run
      - run: bash -n perf/*.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_MSRV" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache; pull requests read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +"$RUST_MSRV" check -p scarletbook -p scarletbook-ffi --all-features --locked

  # Miri's value is mostly in scarletbook-ffi, the only crate with `unsafe`. The unit tests
  # of the core crate (forbid(unsafe_code)) take most of Miri's time, so pull requests run
  # every scarletbook-ffi test and the core crate's integration tests, and pushes to main
  # run everything.
  miri:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal -c miri,rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Miri on scarletbook-ffi
        run: cargo +"$RUST_NIGHTLY" miri test -p scarletbook-ffi --locked
      - name: Miri on scarletbook (integration tests on pull requests, all on main)
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            cargo +"$RUST_NIGHTLY" miri test -p scarletbook --locked --test '*'
          else
            cargo +"$RUST_NIGHTLY" miri test -p scarletbook --locked
          fi
      # The `parallel` path (#28): pool jobs, in-order result slots, the window cap and the C
      # interface's pools. Tree Borrows, not Miri's default Stacked Borrows: under Stacked
      # Borrows Miri reports undefined behaviour inside crossbeam-epoch (rayon's deque), not in
      # this repository's code, and -Zmiri-permissive-provenance does not change that.
      # -Zmiri-ignore-leaks: rayon's threads outlive the tests. The tests run here are ignored
      # under Miri otherwise, hence --include-ignored; property tests run 2 cases under Miri.
      # Pull requests run the C pools and the read-error test (about a minute); pushes to main
      # and manual runs add the continuation property test and the window cap (several
      # minutes).
      - name: Miri on the parallel decoding path (Tree Borrows)
        env:
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-ignore-leaks
        run: |
          cargo +"$RUST_NIGHTLY" miri test -p scarletbook-ffi --locked --test ffi -- --include-ignored \
            pool_handles_of_a_small_image
          tests=(read_error_after_batches_follows_its_frames)
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            tests+=(continuation_across_batches_equals_fresh_scans)
            cargo +"$RUST_NIGHTLY" miri test -p scarletbook --features parallel --locked --lib -- --include-ignored \
              parallel_window_is_capped
          fi
          cargo +"$RUST_NIGHTLY" miri test -p scarletbook --features parallel --locked --test demux_props -- \
            --include-ignored "${tests[@]}"

  ffi:
    name: ffi (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main writes the cache; pull requests read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The committed header is what cbindgen generates
        if: runner.os == 'Linux'
        working-directory: crates/scarletbook-ffi
        run: |
          cargo install cbindgen --locked --version 0.29.4
          cbindgen --config cbindgen.toml --crate scarletbook-ffi --output include/scarletbook.h --verify
      # An addition to the ABI regenerates the baseline abi/abi-N.txt; a breaking change
      # bumps SB_ABI_VERSION and adds abi-(N+1).txt (README, "ABI compatibility"). On a
      # pull request the header is also classified against the base branch's baseline, so a
      # hand-rewritten baseline cannot hide a breaking change, and the baselines of earlier
      # versions must be unchanged.
      - name: The ABI matches its baseline
        if: runner.os == 'Linux'
        run: |
          python3 .github/scripts/abi-check-test.py
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            python3 .github/scripts/abi-check.py
            exit 0
          fi
          current=$(sed -n 's/^#define SB_ABI_VERSION //p' crates/scarletbook-ffi/include/scarletbook.h)
          git fetch --quiet --depth=1 origin "$GITHUB_BASE_REF"
          if git show "FETCH_HEAD:crates/scarletbook-ffi/abi/abi-$current.txt" > "$RUNNER_TEMP/base-abi.txt" 2> /dev/null; then
            python3 .github/scripts/abi-check.py --base "$RUNNER_TEMP/base-abi.txt"
          else
            python3 .github/scripts/abi-check.py
          fi
          edited=$(git diff --no-renames --name-only --diff-filter=MD FETCH_HEAD HEAD -- crates/scarletbook-ffi/abi \
            | grep -v "/abi-$current\.txt$" || true)
          if [[ -n "$edited" ]]; then
            echo "::error::baselines of earlier ABI versions edited or removed: $edited"
            exit 1
          fi
      - run: cargo build -p scarletbook-ffi --release --locked
      - name: Build and run the C smoke test
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Icrates/scarletbook-ffi/include \
            crates/scarletbook-ffi/examples/smoke.c target/release/libscarletbook_ffi.a -lpthread -ldl -lm -o smoke
          for id in hostile-base dst-features-2ch-6ch dst-invalid-frames-6ch layout-2054 master-version-99 truncated-in-audio; do
            ./smoke "corpus/images/$id.iso"
          done

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup toolchain install "$RUST_NIGHTLY" --profile minimal
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz
      - name: Seed from the conformance corpus
        run: cargo +"$RUST_STABLE" run --locked -p scarletbook-conformance --bin scarletbook-seeds -- fuzz/corpus
      - name: Short fuzz run of every target
        working-directory: fuzz
        run: |
          for target in $(cargo +"$RUST_NIGHTLY" fuzz list); do
            echo "::group::$target"
            # The prebuilt cargo-fuzz is a musl binary and would default to a musl target.
            cargo +"$RUST_NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu "$target" "corpus/$target" -- \
              -max_total_time=60 -max_len=327680 -timeout=10
            echo "::endgroup::"
          done
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
