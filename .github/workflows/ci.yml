# SPDX-License-Identifier: MIT OR Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1
  RUST_NIGHTLY: nightly-2026-10-30
  RUST_MSRV: 1.85.0

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --all-features

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal -c rustfmt,clippy && rustup default "$RUST_STABLE"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  # The criterion benchmarks are compiled so that they do not rot; timing them on shared
  # runners would mean nothing (README, "Measuring performance").
  bench-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - run: cargo bench --workspace --locked --no-run
      - run: bash -n perf/*.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_MSRV" --profile minimal
      - run: cargo +"$RUST_MSRV" check -p scarletbook -p scarletbook-ffi --all-features --locked

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal -c miri,rust-src
      - run: cargo +"$RUST_NIGHTLY" miri test -p scarletbook -p scarletbook-ffi --locked

  ffi:
    name: ffi (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - name: The committed header is what cbindgen generates
        if: runner.os == 'Linux'
        working-directory: crates/scarletbook-ffi
        run: |
          cargo install cbindgen --locked --version 0.29.4
          cbindgen --config cbindgen.toml --crate scarletbook-ffi --output include/scarletbook.h --verify
      # An addition to the ABI regenerates the baseline abi/abi-N.txt; a breaking change
      # bumps SB_ABI_VERSION and adds abi-(N+1).txt (README, "ABI compatibility"). On a
      # pull request the header is also classified against the base branch's baseline, so a
      # hand-rewritten baseline cannot hide a breaking change, and the baselines of earlier
      # versions must be unchanged.
      - name: The ABI matches its baseline
        if: runner.os == 'Linux'
        run: |
          python3 .github/scripts/abi-check-test.py
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            python3 .github/scripts/abi-check.py
            exit 0
          fi
          current=$(sed -n 's/^#define SB_ABI_VERSION //p' crates/scarletbook-ffi/include/scarletbook.h)
          git fetch --quiet --depth=1 origin "$GITHUB_BASE_REF"
          if git show "FETCH_HEAD:crates/scarletbook-ffi/abi/abi-$current.txt" > "$RUNNER_TEMP/base-abi.txt" 2> /dev/null; then
            python3 .github/scripts/abi-check.py --base "$RUNNER_TEMP/base-abi.txt"
          else
            python3 .github/scripts/abi-check.py
          fi
          edited=$(git diff --no-renames --name-only --diff-filter=MD FETCH_HEAD HEAD -- crates/scarletbook-ffi/abi \
            | grep -v "/abi-$current\.txt$" || true)
          if [[ -n "$edited" ]]; then
            echo "::error::baselines of earlier ABI versions edited or removed: $edited"
            exit 1
          fi
      - run: cargo build -p scarletbook-ffi --release --locked
      - name: Build and run the C smoke test
        run: |
          cc -std=c99 -Wall -Wextra -Werror -pedantic -Icrates/scarletbook-ffi/include \
            crates/scarletbook-ffi/examples/smoke.c target/release/libscarletbook_ffi.a -lpthread -ldl -lm -o smoke
          for id in hostile-base dst-features-2ch-6ch dst-invalid-frames-6ch layout-2054 master-version-99 truncated-in-audio; do
            ./smoke "corpus/images/$id.iso"
          done

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup toolchain install "$RUST_NIGHTLY" --profile minimal
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz
      - name: Seed from the conformance corpus
        run: cargo +"$RUST_STABLE" run --locked -p scarletbook-conformance --bin scarletbook-seeds -- fuzz/corpus
      - name: Short fuzz run of every target
        working-directory: fuzz
        run: |
          for target in $(cargo +"$RUST_NIGHTLY" fuzz list); do
            echo "::group::$target"
            # The prebuilt cargo-fuzz is a musl binary and would default to a musl target.
            cargo +"$RUST_NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu "$target" "corpus/$target" -- \
              -max_total_time=60 -max_len=327680 -timeout=10
            echo "::endgroup::"
          done
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
