# SPDX-License-Identifier: MIT OR Apache-2.0
name: Miri slices

# The Miri slices, called by ci.yml (the short slices, on every pull request and push) and by
# miri-full.yml (the long slices, on main): one definition of what each slice runs (#76, #84).
# `scarletbook` and `scarletbook-ffi` always run as separate commands: one command over both
# would enable `parallel` for both through feature unification, and the core then reaches
# rayon under Stacked Borrows (see the parallel slices below, and #71).

on:
  workflow_call:
    inputs:
      slices:
        description: JSON list of slice names
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The same pinned nightly as ci.yml's RUST_NIGHTLY (a called workflow does not inherit it).
  RUST_NIGHTLY: nightly-2026-10-30

defaults:
  run:
    shell: bash

jobs:
  miri:
    name: miri (${{ matrix.slice }})
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(inputs.slices) }}
    runs-on: ubuntu-latest
    # About twice each slice's measured time, so that a stuck run fails within the hour instead
    # of GitHub's 6-hour default (#205). Slices not listed get 20 minutes.
    timeout-minutes: ${{ fromJSON('{"core-tags":60,"core-chain":55,"core":45,"core-dispatch":25,"lanes-1-2":20,"lanes-3":20,"lanes-4":20}')[matrix.slice] || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal -c miri,rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # One cache per feature set, shared by the slices (they build the same crates).
          key: miri-${{ startsWith(matrix.slice, 'parallel') && 'parallel' || 'default' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The `parallel` slices use Tree Borrows, not Miri's default Stacked Borrows: under
      # Stacked Borrows Miri reports undefined behaviour inside crossbeam-epoch (rayon's
      # deque), not in this repository's code, and -Zmiri-permissive-provenance does not
      # change that (#28, #71). -Zmiri-ignore-leaks: rayon's threads outlive the tests. The
      # tests they run are ignored under Miri otherwise, hence --include-ignored; property
      # tests run 2 cases under Miri.
      - name: Miri slice
        env:
          SLICE: ${{ matrix.slice }}
          # scarletbook-ffi's slowest test binaries under Miri, the `ffi-slow` slice.
          FFI_SLOW: sectors pcm
          # The core crate's slowest integration-test binaries under Miri, by slice (#205):
          # `core-tags` and `core-chain` run these, `core` every other file in tests/.
          CORE_TAGS: output_tags
          CORE_CHAIN: output_dsf_chain output_dsdiff_text
        run: |
          # Every named test must exist and run: a renamed test fails the slice instead of
          # leaving it to pass with nothing run. `named N` checks the libtest summaries of the
          # command just before it (the per-test lines can be split by Miri's warnings).
          last=0
          miri() {
            local out rc
            out=$(mktemp)
            cargo +"$RUST_NIGHTLY" miri test --locked "$@" 2>&1 | tee "$out"
            rc=${PIPESTATUS[0]}
            last=$(grep -oE '^test result: ok\. [0-9]+ passed' "$out" | awk '{s += $4} END {print s + 0}')
            return "$rc"
          }
          tb() { MIRIFLAGS="-Zmiri-tree-borrows -Zmiri-ignore-leaks" miri "$@"; }
          named() {
            if [[ "$last" -lt "$1" ]]; then
              echo "::error::slice $SLICE ran $last named tests, expected $1"
              exit 1
            fi
          }
          case "$SLICE" in
            # scarletbook-ffi's tests, in two slices of about 4 minutes each (#205): `ffi-slow`
            # runs the two slowest test binaries, `ffi` the library's unit tests, every other
            # test binary (listed from tests/, so a new file lands here) and the doctests.
            ffi)
              args=(--lib)
              for f in crates/scarletbook-ffi/tests/*.rs; do
                t=$(basename "$f" .rs)
                [[ " $FFI_SLOW " == *" $t "* ]] || args+=(--test "$t")
              done
              miri -p scarletbook-ffi "${args[@]}"
              miri -p scarletbook-ffi --doc ;;
            ffi-slow)
              args=()
              for t in $FFI_SLOW; do args+=(--test "$t"); done
              miri -p scarletbook-ffi "${args[@]}" ;;
            # The core crate's integration tests, in three slices balanced by their time under
            # Miri (#205); together they run every file in tests/, as `--test '*'` did. Each
            # named file must exist and be named once, so that no file is run twice or dropped.
            core | core-tags | core-chain)
              named_files="$CORE_TAGS $CORE_CHAIN"
              for t in $named_files; do
                if [[ ! -f "crates/scarletbook/tests/$t.rs" ]]; then
                  echo "::error::Miri core slices name tests/$t.rs, which does not exist"
                  exit 1
                fi
              done
              dup=$(tr ' ' '\n' <<< "$named_files" | sed '/^$/d' | sort | uniq -d)
              if [[ -n "$dup" ]]; then
                echo "::error::Miri core slices name these test files more than once: $dup"
                exit 1
              fi
              args=()
              case "$SLICE" in
                core-tags) for t in $CORE_TAGS; do args+=(--test "$t"); done ;;
                core-chain) for t in $CORE_CHAIN; do args+=(--test "$t"); done ;;
                core)
                  for f in crates/scarletbook/tests/*.rs; do
                    t=$(basename "$f" .rs)
                    [[ " $named_files " == *" $t "* ]] || args+=(--test "$t")
                  done ;;
              esac
              miri -p scarletbook "${args[@]}" ;;
            core-lib) miri -p scarletbook --lib -- --skip fast_loop_matches_general ;;
            # The run-time dispatch of the DST decoder and of the output path, the core crate's
            # unsafe code (#146, #202): on pull requests that change them (ci.yml), about 12 minutes.
            core-dispatch)
              miri -p scarletbook --lib -- --exact dispatch::tests::detected_decoder_matches_generic_simple \
                dispatch::output_tests::detected_output_matches_generic_simple
              named 2 ;;
            lanes-1-2)
              miri -p scarletbook --lib -- --exact dst::tests::fast_loop_matches_general_1_frame \
                dst::tests::fast_loop_matches_general_2_frames
              named 2 ;;
            lanes-3) miri -p scarletbook --lib -- --exact dst::tests::fast_loop_matches_general_3_frames; named 1 ;;
            lanes-4) miri -p scarletbook --lib -- --exact dst::tests::fast_loop_matches_general_4_frames; named 1 ;;
            parallel)
              tb -p scarletbook-ffi --test ffi -- --include-ignored --exact pool_handles_of_a_small_image
              named 1
              tb -p scarletbook-ffi --test output -- --include-ignored --exact freeing_handles_during_a_read
              named 1
              tb -p scarletbook --features parallel --test demux_props -- --include-ignored --exact \
                read_error_after_batches_follows_its_frames
              named 1 ;;
            parallel-window)
              tb -p scarletbook --features parallel --lib -- --include-ignored --exact \
                audio::tests::parallel_window_is_capped
              named 1 ;;
            parallel-continuation)
              tb -p scarletbook --features parallel --test demux_props -- --include-ignored --exact \
                continuation_across_batches_equals_fresh_scans
              named 1 ;;
            *) echo "::error::unknown Miri slice $SLICE"; exit 1 ;;
          esac
