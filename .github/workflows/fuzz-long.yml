name: Long fuzz

# The PR workflow fuzzes each target for 60 s, a smoke test. This runs every target for
# much longer, weekly and on demand, and keeps crashing inputs and the grown corpus.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes per target
        default: "40"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1
  RUST_NIGHTLY: nightly-2026-10-30

defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [toc, demux, dst]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup toolchain install "$RUST_NIGHTLY" --profile minimal
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz
      - name: Seed from the conformance corpus
        run: cargo +"$RUST_STABLE" run --locked -p scarletbook-conformance --bin scarletbook-seeds -- fuzz/corpus
      - name: Fuzz
        working-directory: fuzz
        env:
          MINUTES: ${{ inputs.minutes || '40' }}
          TARGET: ${{ matrix.target }}
        run: |
          # The prebuilt cargo-fuzz is a musl binary and would default to a musl target.
          cargo +"$RUST_NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu "$TARGET" "corpus/$TARGET" -- \
            -max_total_time=$((MINUTES * 60)) -max_len=327680 -timeout=10 -fork=4 -ignore_crashes=0
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crashes-${{ matrix.target }}
          path: fuzz/artifacts
      - name: Keep the grown corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
