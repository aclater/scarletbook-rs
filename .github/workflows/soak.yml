# SPDX-License-Identifier: MIT OR Apache-2.0
name: Memory soak

# An hour of open, seek, decode (DST and plain DSD), PCM conversion and output layouts
# through the Rust API and the C interface, over corpus discs (#238); weekly and on demand.
# The soak example samples resident memory and the heap every minute and fails unless both
# plateau after warm-up (crates/scarletbook-ffi/examples/soak.rs). The pull-request checks
# are CI's `lsan` job and scarletbook-ffi's tests/no_growth.rs.

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to run
        default: "60"

permissions:
  contents: read

# One soak at a time; a second one waits rather than cancelling the first.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1

defaults:
  run:
    shell: bash

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal && rustup default "$RUST_STABLE"
      - run: cargo build --release --locked -p scarletbook-ffi --example soak
      - name: Soak
        env:
          MINUTES: ${{ inputs.minutes || '60' }}
        run: |
          # Passed on as an argument: accept digits only.
          if ! [[ $MINUTES =~ ^[0-9]+$ ]] || (( 10#$MINUTES < 2 || 10#$MINUTES > 100 )); then
            echo "::error::minutes must be 2 to 100"
            exit 1
          fi
          set -o pipefail
          target/release/examples/soak --minutes "$MINUTES" --csv soak.csv | tee soak.txt
      - name: Summary
        if: always()
        run: |
          if [[ -f soak.txt ]]; then
            { echo '```'; cat soak.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak
          path: |
            soak.csv
            soak.txt
          if-no-files-found: ignore
