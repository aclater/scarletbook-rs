# SPDX-License-Identifier: MIT OR Apache-2.0
name: Coverage

# Line coverage of the workspace tests (all features), uploaded to Codecov with the
# workflow's OIDC token; no token secret. The fuzz crate is its own workspace and is not
# measured. An upload outage does not fail the job.
#
# The tests run under cargo-nextest, one process per test, so the test binaries run in
# parallel instead of one after another: the same tests as `cargo test` (doctests were not
# measured before either), in less time (#205). The instrumented build has
# its own cache, written by main like the other caches.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1

defaults:
  run:
    shell: bash

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Codecov upload authentication (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal -c llvm-tools-preview && rustup default "$RUST_STABLE"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
          # cargo-llvm-cov builds into its own target directory.
          workspaces: ". -> target/llvm-cov-target"
          # Only main writes the cache; pull requests read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.148
      - run: cargo llvm-cov nextest --workspace --all-features --locked --lcov --output-path lcov.info
      # A pull request from a fork gets no OIDC token, so its upload is skipped.
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
