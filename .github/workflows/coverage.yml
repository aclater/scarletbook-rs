name: Coverage

# Line coverage of the workspace tests (all features), uploaded to Codecov with the
# workflow's OIDC token; no token secret. The fuzz crate is its own workspace and is not
# measured. An upload outage does not fail the job.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_STABLE: 1.99.1

defaults:
  run:
    shell: bash

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Codecov upload authentication (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUST_STABLE" --profile minimal -c llvm-tools-preview && rustup default "$RUST_STABLE"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
      # A pull request from a fork gets no OIDC token, so its upload is skipped.
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
