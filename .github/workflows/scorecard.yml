# SPDX-License-Identifier: MIT OR Apache-2.0
name: Scorecard

# OpenSSF Scorecard. Publishing (the badge, api.scorecard.dev) restricts this workflow: no
# top-level env or defaults, no write permission at the top, and only the actions below in
# the job (ossf/scorecard-action README, "Workflow Restrictions").

on:
  schedule:
    - cron: "41 4 * * 2"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  branch_protection_rule:

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish the results (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Pull request runs only check the branch; runs on main publish.
          publish_results: ${{ github.event_name != 'pull_request' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
